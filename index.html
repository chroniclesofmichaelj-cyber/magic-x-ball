<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Magic X Ball</title>
  <meta name="description" content="A magic X ball that fails to solve your burning questions with hilarious answers and questionable advice.">
  <meta name="theme-color" content="#0b0b14">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <button class="ball" id="ball" type="button" aria-label="Shake the magic X ball">
      <span class="ball__shine" aria-hidden="true"></span>
      <span class="ball__face ball__face--mark" aria-hidden="true">
        <svg class="eye" viewBox="0 0 100 100">
          <g class="eye__lid">
            <path d="M8 50 Q50 12 92 50 Q50 88 8 50 Z" fill="#fff" stroke="#14121c" stroke-width="5" stroke-linejoin="round"/>
            <circle cx="50" cy="50" r="19" fill="url(#iris)"/>
            <circle cx="50" cy="50" r="9" fill="#14121c"/>
            <circle cx="56" cy="43" r="4.5" fill="#fff"/>
          </g>
          <defs>
            <radialGradient id="iris" cx="45%" cy="40%" r="65%">
              <stop offset="0" stop-color="#ff8fab"/>
              <stop offset=".6" stop-color="#c2378a"/>
              <stop offset="1" stop-color="#5b1a6e"/>
            </radialGradient>
          </defs>
        </svg>
      </span>
      <span class="ball__face ball__face--window" aria-hidden="true">
        <span class="triangle">
          <span class="answer" id="answer"></span>
        </span>
      </span>
    </button>

    <p class="hint" id="hint">Think of a question, then shake your phone or tap the ball.</p>
    <p class="sr-only" id="live" aria-live="polite"></p>
  </main>

  <div class="wake" id="wake" hidden>
    <div class="wake__card">
      <p class="wake__title">The ball is asleep.</p>
      <p class="wake__text">Let it feel your phone move so you can shake it for answers.</p>
      <button class="wake__btn" id="wakeBtn" type="button">Tap to wake the ball</button>
      <button class="wake__skip" id="wakeSkip" type="button">I'll just tap it</button>
    </div>
  </div>

  <script src="answers.js"></script>
  <script src="app.js"></script>
</body>
</html>
